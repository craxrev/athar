    <!--
      THESIS: A record of work reconstructed from evidence, where every claim
      shows how it was established. A day is the unit, and each range draws it at
      the coarsest grain that still resolves one: an hour-lane, a row, a tile, a
      cell. The old ban on the calendar grid was revoked by measurement — at all
      time a grid of dates is the only arrangement that holds 2,697 days and
      still resolves one — but not the rule under it: a cell earns its place by
      carrying real hours and a real class, never by being a date in a box.
      OWN-WORLD: Dark only. Vibrancy glass on the scope rail, solid near-black
      for dense content. One magenta accent as flat fill for selection and live
      state, never as glow and never as a row type. Amber reserved for
      uncertainty. Git's red and green keep their meaning. Category hue is dealt
      from the configured roots, out of a palette that excludes all three. Solid
      weights at generous sizes, nothing below 13px; 1px dividers carry
      structure, type never goes hairline.
      STORY: The visitor sees where a week actually went, moves into the day, and
      opens the conversation that produced a commit.
      FIRST VIEWPORT: Scope rail left; the week as days, every hour resolved,
      marks carrying project in their hue and evidence in their texture. The
      detail pane starts folded — it answers a selection, and there is none yet.
      FORM: The category standard, played straight, at Raycast's craft level —
      the standing exit, taken after two re-rolls. Seed key fa015326.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    %sveltekit.body%
  </body>
